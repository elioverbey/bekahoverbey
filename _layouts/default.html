<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | relative_url }}">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📕</text></svg>" type="image/svg+xml">

  <!-- Social Sharing / Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ site.url }}/assets/images/og-image.png">
  <meta property="og:url" content="{{ site.url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="{{ site.url }}/assets/images/og-image.png">

  <!-- Fonts are self-hosted in /assets/fonts/ — no external requests -->
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Bekah Overbey",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}/assets/images/bekah-author.jpg",
    "jobTitle": "Author",
    "description": "Author of romcoms with heart, humor, and depth.",
    "sameAs": [
      "https://www.instagram.com/bekahoverbeybooks",
      "https://www.amazon.com/stores/author/B09ZWGZ1Z3",
      "https://www.goodreads.com/author/show/22431020.Bekah_Overbey"
    ]
  }
  </script>
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": "Book",
      "name": "Anything, Everything",
      "author": { "@type": "Person", "name": "Bekah Overbey" },
      "datePublished": "2025",
      "genre": ["Romance", "Romcom"],
      "url": "https://www.amazon.com/Anything-Everything-Bekah-Overbey/dp/B0FHW4TFNR"
    },
    {
      "@context": "https://schema.org",
      "@type": "Book",
      "name": "Just Don't Say Love",
      "author": { "@type": "Person", "name": "Bekah Overbey" },
      "datePublished": "2024",
      "genre": ["Romance", "Romcom"],
      "url": "https://www.amazon.com/Just-Dont-Love-Bekah-Overbey/dp/B0D96P9XT3"
    },
    {
      "@context": "https://schema.org",
      "@type": "Book",
      "name": "Hideaway",
      "author": { "@type": "Person", "name": "Bekah Overbey" },
      "datePublished": "2023",
      "genre": ["Romance", "Romcom"],
      "url": "https://www.amazon.com/Hideaway-Bekah-Overbey/dp/B0C5G7H3C3"
    },
    {
      "@context": "https://schema.org",
      "@type": "Book",
      "name": "The Block Island Charade",
      "author": { "@type": "Person", "name": "Bekah Overbey" },
      "datePublished": "2022",
      "genre": ["Historical Romance", "Romcom"],
      "url": "https://www.amazon.com/Block-Island-Charade-Summer/dp/B09ZJ5TKG6"
    }
  ]
  </script>
</head>
<body>
  {{ content }}
</body>
</html>
